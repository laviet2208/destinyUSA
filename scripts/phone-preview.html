<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#48217D" />
    <title>Destiny USA</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f0edf4; }
      body { display: flex; justify-content: center; }
      iframe { width: 100%; max-width: 430px; height: 100%; height: 100dvh; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <iframe src="/app/" title="Destiny USA — Mobile" allow="clipboard-write"></iframe>
    <script>
      const phoneWidth = Number(new URLSearchParams(location.search).get('width'));
      if ([320, 360, 390, 430, 480].includes(phoneWidth)) {
        document.querySelector('iframe').style.maxWidth = phoneWidth + 'px';
      }
    </script>
  </body>
</html>
